[project]
name = "filelore"
version = "0.1.0"
description = "A local-first file indexing and search experiment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15,<5",
    "markdown-it-py>=4,<5",
    "mutagen>=1.47,<2",
    "numpy>=2,<3",
    "Pillow>=10,<13",
    "pypdf>=6.14,<7",
    "qdrant-client>=1.18,<2",
    "rich>=14,<15",
    "soundfile>=0.13,<1",
    "soxr>=1,<2",
    "textual>=8.2,<9",
]

[project.optional-dependencies]
embedding = [
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "transformers>=4.50,<5",
]

[dependency-groups]
profiling = ["psutil>=6,<8"]
test = [
    "pytest>=8,<10",
    "reportlab>=5,<6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
